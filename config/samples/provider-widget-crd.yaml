# The provider side of the demo. Apply this on the PROVIDER cluster:
#   - the Widget CRD, labeled as exported (the core's entire provider opt-in),
#   - a Secret + ConfigMap the service ships alongside its API ("related
#     resources"), selected by label and synced provider -> consumer.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.org
  labels:
    core.kbind.io/exported: "true"
spec:
  group: example.org
  names:
    plural: widgets
    singular: widget
    kind: Widget
    listKind: WidgetList
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                size:
                  type: string
            status:
              type: object
              properties:
                phase:
                  type: string
      additionalPrinterColumns:
        - name: Size
          type: string
          jsonPath: .spec.size
        - name: Phase
          type: string
          jsonPath: .status.phase
---
# Related resources: connection details and tuning the service hands to every
# consumer. Anything matching the binding's selector syncs to the consumer.
apiVersion: v1
kind: Secret
metadata:
  name: widgets-connection
  namespace: default
  labels:
    widgets.example.org/related: "true"
stringData:
  endpoint: https://widgets.internal.example.org
  api-key: demo-not-a-real-key
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: widgets-tuning
  namespace: default
  labels:
    widgets.example.org/related: "true"
data:
  pointiness: "11"
