name: Docs

on:
  workflow_dispatch:
  pull_request:
    branches:
      - v2-next
    paths:
      - "docs/**"
      - "cli/**"
      - "cmd/**"
      - "backend/**"
      - "engine/**"
      - "pkg/**"
      - "deploy/charts/**"
      - "sdk/apis/**"
      - "go.mod"
      - "go.sum"
      - "sdk/go.mod"
      - "sdk/go.sum"
      - "Makefile"
      - ".github/workflows/docs-gen-and-push.yaml"
  push:
    branches:
      - v2-next
      - docs-v2
    paths:
      - "docs/**"
      - "cli/**"
      - "cmd/**"
      - "backend/**"
      - "engine/**"
      - "pkg/**"
      - "deploy/charts/**"
      - "sdk/apis/**"
      - "go.mod"
      - "go.sum"
      - "sdk/go.mod"
      - "sdk/go.sum"
      - "Makefile"
      - ".github/workflows/docs-gen-and-push.yaml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: make docs-venv build-docs

  publish:
    if: >-
      github.repository == 'kbind-dev/kbind' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/v2-next' || github.ref == 'refs/heads/docs-v2')
    needs: build
    permissions:
      contents: write
    concurrency:
      group: Docs
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - name: Publish preview without changing latest
        env:
          PUSH: "1"
        run: |
          git config user.name "kbind-ci-bot"
          git config user.email "no-reply@kbind.dev"
          make docs-venv deploy-docs
