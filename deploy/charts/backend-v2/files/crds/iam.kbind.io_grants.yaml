---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.2
  name: grants.iam.kbind.io
spec:
  group: iam.kbind.io
  names:
    categories:
    - kbind
    kind: Grant
    listKind: GrantList
    plural: grants
    singular: grant
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.identity.subject
      name: Subject
      type: string
    - jsonPath: .spec.exportName
      name: Export
      type: string
    - jsonPath: .status.namespace
      name: Namespace
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Grant records that an identity was issued credentials for an export. The
          gateway creates it with the export's API list and defaults resolved in
          (issuance is a stable record even if the catalog entry changes later), the
          issuer controller provisions the tenancy boundary, ServiceAccount, RBAC and
          token from the spec and reports the artifacts in status. Deleting the Grant
          revokes: the issuer's cleanup finalizer unwinds everything it provisioned.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: GrantSpec is the issuance request/record.
            properties:
              apis:
                description: |-
                  apis is the export's API list resolved at issuance time, by CRD name on
                  the provider ("<plural>.<group>"). The issuer scopes RBAC to exactly
                  these.
                items:
                  description: |-
                    APIRef identifies an exported API by its CRD name on the provider,
                    i.e. "<plural>.<group>" (for example "mangodbs.mangodb.io"). Under the
                    OpenAPI schema source there is no CRD object behind the name, it is still
                    just resource + group.
                  properties:
                    name:
                      description: name is the CRD name of the exported API, "<plural>.<group>".
                      minLength: 1
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              conflictPolicy:
                description: |-
                  conflictPolicy is the export's default conflict policy resolved at
                  issuance time, copied into the generated bundle's ClusterBinding.
                enum:
                - Fail
                - Adopt
                type: string
              exportName:
                description: exportName records which catalog Export this Grant was
                  issued for.
                minLength: 1
                type: string
              identity:
                description: identity is who the credentials were issued to.
                properties:
                  displayName:
                    description: displayName is a human-facing name (e.g. email),
                      informational only.
                    type: string
                  groups:
                    description: groups the identity carried at issuance, informational
                      only.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: atomic
                  subject:
                    description: subject is the stable identity key, "<issuer>#<subject>"
                      for OIDC.
                    minLength: 1
                    type: string
                required:
                - subject
                type: object
              relatedResources:
                description: |-
                  relatedResources are the export's related-resource selectors resolved at
                  issuance time. They flow into the bundle's ClusterBinding and widen the
                  issued RBAC (secrets/configmaps in the declared direction).
                items:
                  description: |-
                    RelatedResource selects auxiliary objects (Secrets/ConfigMaps) to sync
                    alongside the bound instances.
                  properties:
                    direction:
                      description: direction the related resource flows.
                      enum:
                      - FromProvider
                      - FromConsumer
                      type: string
                    group:
                      default: ""
                      description: group of the related resource. Empty string for
                        the core group.
                      type: string
                    resource:
                      description: |-
                        resource is the plural resource name. Only "secrets" and "configmaps"
                        are permitted in core.
                      enum:
                      - secrets
                      - configmaps
                      type: string
                    selector:
                      description: |-
                        selector restricts which objects are synced. Only labelSelector and
                        named selectors are supported in core (no JSONPath reference-following).
                      properties:
                        labelSelector:
                          description: labelSelector selects related objects by label.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector
                                requirements. The requirements are ANDed.
                              items:
                                description: |-
                                  A label selector requirement is a selector that contains values, a key, and an operator that
                                  relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector
                                      applies to.
                                    type: string
                                  operator:
                                    description: |-
                                      operator represents a key's relationship to a set of values.
                                      Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: |-
                                      values is an array of string values. If the operator is In or NotIn,
                                      the values array must be non-empty. If the operator is Exists or DoesNotExist,
                                      the values array must be empty. This array is replaced during a strategic
                                      merge patch.
                                    items:
                                      type: string
                                    type: array
                                    x-kubernetes-list-type: atomic
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                              x-kubernetes-list-type: atomic
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: |-
                                matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                                map is equivalent to an element of matchExpressions, whose key field is "key", the
                                operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                          x-kubernetes-map-type: atomic
                        names:
                          description: names selects related objects by exact name.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: set
                      type: object
                  required:
                  - direction
                  - group
                  - resource
                  type: object
                type: array
                x-kubernetes-list-type: atomic
            required:
            - apis
            - exportName
            - identity
            type: object
          status:
            description: GrantStatus reports what the issuer provisioned.
            properties:
              conditions:
                description: 'conditions: Ready (credentials provisioned and token
                  populated).'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              namespace:
                description: namespace is the per-consumer tenancy boundary on the
                  provider.
                type: string
              serviceAccount:
                description: serviceAccount is the name of the issued ServiceAccount
                  (in namespace).
                type: string
              tokenSecret:
                description: |-
                  tokenSecret is the name of the long-lived SA token Secret (in
                  namespace). The gateway reads it to assemble the bundle's kubeconfig.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
